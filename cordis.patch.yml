# dsh-notification-hook — inserts one row into the profile roster.
# The row is the host half: delivery happens from the harness Host process itself. The bundle
# also declares `dsh.client`, which adds a settings page to the Web UI (Settings → Plugins).
# Everything in this config block can also be edited from that page; this file is the fallback
# and the source of the defaults.
#
# Every value below is optional; the plugin has working defaults for all of them.
- insert:
    - id: notify-hook
      name: dsh-notification-hook
      config:
        enabled: true
        # Language follows DSH's global preference. Older profiles may keep
        # `locale: auto | zh | en` as a fallback if DSH's locale namespace is unavailable.
        # Which outcomes announce themselves. Failures and awaiting-input are the ones a
        # user actually loses time to, so they are on by default.
        events:
          completed: true
          failed: true
          awaitingInput: true
          attention: true
          cancelled: false
        # A completed turn shorter than this is not announced (failures / waiting always are).
        minDurationMs: 10000
        # How long a permission prompt must stay open before it is announced. A prompt that
        # resolves itself stays silent.
        awaitingInputDelayMs: 2500
        # Notify for subagent sessions as well.
        includeSubagents: false
        desktop:
          enabled: true
          sound: false
          # Windows only: AppUserModelID override. Empty uses the PowerShell AUMID, which is
          # always registered and therefore reliably renders a toast.
          appId: ''
          timeoutMs: 10000
        # Webhook targets are configured in the settings page. Provider-specific endpoint
        # templates and setup steps live in docs/WEBHOOK-GUIDE*.md so this publishable patch
        # can stay free of credential-shaped examples.
        # Empty by default: an unconfigured plugin must not talk to the network. (An earlier
        # revision of this file shipped a loopback target used to verify the install; it has
        # been removed, because a shipped default that posts on every activation is a bug.)
        webhooks: []
        timeoutMs: 8000
        retries: 1
        logDeliveries: true
        # Send one test notification the moment the row activates (setup aid). Keep this false
        # in a committed profile: it fires on every config reload. The settings UI has a
        # "send test notification" button that arms this, fires, and disarms it again.
        testOnActivate: false
        #
        # To silence the plugin without unloading it, either set `enabled: false` above, or
        # disable the row itself (the idiomatic switch, written by plugin_manager set_plugin):
        #   - id: notify-hook
        #     disabled: true
